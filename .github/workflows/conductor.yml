name: vega-closet conductor

on:
  # daily run (UTC; GitHub may fire up to a few hours late, which is fine for a feed)
  schedule:
    - cron: '0 13 * * *'
  # on-demand: run from the Actions tab, or via API (the in-app "run now" button)
  workflow_dispatch:
    inputs:
      sources:
        description: 'sources to scrape: grailed,therealreal,ssense'
        default: 'grailed'
      max_per_brand:
        description: 'max items per brand'
        default: '40'
      brands_per_run:
        description: 'how many loved brands to scrape this run'
        default: '24'
      min_new:
        description: 'target new pieces: top up brands to reach it, then cap at exactly this many (best-scored kept; 0 = uncapped)'
        default: '0'
      brands:
        description: 'specific brands (comma list) to scrape instead of the rotation'
        default: ''
      query:
        description: 'keyword / style / color to search for (passes to Algolia text search)'
        default: ''
      category:
        description: 'only scan one category: outerwear | tops | bottoms | footwear | accessories'
        default: ''
      no_vision:
        description: 'raw scan: skip the taste rating, items come back tagged unrated'
        default: ''
      gender:
        description: 'scan scope: men | women (blank = all genders users need)'
        default: ''
      trr_probe:
        description: 'schema probe only (no scan, no rebuild): introspect TRR GraphQL'
        default: ''
      recheck:
        description: 're-check stored TRR listings still live in feeds (nightly runs always do)'
        default: ''

# never let two runs stomp each other
concurrency:
  group: vega-conductor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # 90, not 30: the full 3-source scan alone can run ~35 min through the stealth proxy, and this
    # job also carries the rebuild + nucleus steps. At 30 the timeout killed every scheduled scan
    # Aug 5-10 BEFORE the catalog insert — scraping spent, zero items stored.
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'     # line-by-line log timestamps (buffered output made every scan line flush at once)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: scrape + upsert catalog
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          APIFY_TOKEN:         ${{ secrets.APIFY_TOKEN }}
          FIRECRAWL_KEY:       ${{ secrets.FIRECRAWL_KEY }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          BRIGHTDATA_TOKEN:    ${{ secrets.BRIGHTDATA_TOKEN }}
          SOURCES:        ${{ github.event.inputs.sources || 'grailed,therealreal,ssense' }}
          MAX_PER_BRAND:  ${{ github.event.inputs.max_per_brand || '40' }}
          BRANDS_PER_RUN: ${{ github.event.inputs.brands_per_run || '24' }}
          MIN_NEW:        ${{ github.event.inputs.min_new || '0' }}
          BRANDS:         ${{ github.event.inputs.brands || '' }}
          QUERY:          ${{ github.event.inputs.query || '' }}
          CATEGORY:       ${{ github.event.inputs.category || '' }}
          NO_VISION:      ${{ github.event.inputs.no_vision || '' }}
          GENDER:         ${{ github.event.inputs.gender || '' }}
          TRR_PROBE:      ${{ github.event.inputs.trr_probe || '' }}
        run: python pipeline/conductor.py

      - name: re-check TRR listings still live in feeds   # nightly: sold pieces vanish before the rebuild
        if: ${{ !cancelled() && github.event.inputs.trr_probe == '' && (github.event_name == 'schedule' || github.event.inputs.recheck == '1') }}
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          FIRECRAWL_KEY:       ${{ secrets.FIRECRAWL_KEY }}
        run: python pipeline/recheck_trr.py

      - name: rebuild every user's feed
        if: ${{ !cancelled() && github.event.inputs.trr_probe == '' }}
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
        run: python pipeline/build_feed_cloud.py

      - name: nucleus admin snapshot        # refresh the admin dashboard after every scan + rebuild
        if: ${{ !cancelled() && github.event.inputs.trr_probe == '' }}
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python pipeline/build_nucleus.py
